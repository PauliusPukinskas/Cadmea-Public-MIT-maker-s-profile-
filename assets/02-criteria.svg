<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Six illustrative CADMEA decision criterion weights totaling 100 percent"><rect width="1200" height="650" fill="#FAFAF8"/><path d="M0 0H1200" stroke="#C83F3B" stroke-width="10"/><text x="56" y="59" fill="#C83F3B" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3">CADMEA / ENGINEERING FIELD NOTES</text><text x="56" y="120" font-family="Arial,Helvetica,sans-serif" font-size="39" fill="#182122" font-weight="700">Six criteria. Explicit policy choices.</text><text x="56" y="156" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#67716F" >Illustrative pilot defaults from the archived decision model, not municipal policy</text><text x="56" y="228" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#23302F" font-weight="700">Demand pressure</text><rect x="420" y="205" width="600" height="28" fill="#E7EAE5"/><rect x="420" y="205" width="600" height="28" fill="#BE3B39"/><text x="1040" y="228" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1F2D2B" font-weight="700">30%</text><text x="56" y="294" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#23302F" font-weight="700">Access gap</text><rect x="420" y="271" width="600" height="28" fill="#E7EAE5"/><rect x="420" y="271" width="500" height="28" fill="#497464"/><text x="1040" y="294" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1F2D2B" font-weight="700">25%</text><text x="56" y="360" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#23302F" font-weight="700">Facility pressure</text><rect x="420" y="337" width="600" height="28" fill="#E7EAE5"/><rect x="420" y="337" width="300" height="28" fill="#497464"/><text x="1040" y="360" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1F2D2B" font-weight="700">15%</text><text x="56" y="426" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#23302F" font-weight="700">Resident input</text><rect x="420" y="403" width="600" height="28" fill="#E7EAE5"/><rect x="420" y="403" width="200" height="28" fill="#497464"/><text x="1040" y="426" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1F2D2B" font-weight="700">10%</text><text x="56" y="492" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#23302F" font-weight="700">Asset condition</text><rect x="420" y="469" width="600" height="28" fill="#E7EAE5"/><rect x="420" y="469" width="200" height="28" fill="#497464"/><text x="1040" y="492" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1F2D2B" font-weight="700">10%</text><text x="56" y="558" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#23302F" font-weight="700">Value for money</text><rect x="420" y="535" width="600" height="28" fill="#E7EAE5"/><rect x="420" y="535" width="200" height="28" fill="#497464"/><text x="1040" y="558" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1F2D2B" font-weight="700">10%</text><text x="56" y="614" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#63716A" >All six weights can be configured. Default total: 100%. Weights are not learned from data.</text></svg>