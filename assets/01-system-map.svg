<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="CADMEA five stage system: map city, clean data, evaluate proposals, inspect uncertainty, human review"><rect width="1200" height="560" fill="#FAFAF8"/><path d="M0 0H1200" stroke="#C83F3B" stroke-width="10"/><text x="56" y="59" fill="#C83F3B" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3">CADMEA / ENGINEERING FIELD NOTES</text><text x="56" y="120" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#182122" font-weight="700">From geographic evidence to a reviewable decision</text><text x="56" y="155" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6B7372" >A public architecture overview, not a deployment diagram or complete decision policy</text><rect x="56" y="205" width="205" height="186" rx="2" fill="#FFFFFF" stroke="#D6D9D5" stroke-width="2"/><path d="M56 205h205" stroke="#C83F3B" stroke-width="6"/><text x="74" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#BA4944" font-weight="700">01 / STEP</text><text x="74" y="291" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1C2727" font-weight="700">Map city</text><text x="74" y="332" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#485755" >Sports facilities</text><text x="74" y="356" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#485755" >Candidate areas</text><path d="M266 290h13m-5 -6l6 6l-6 6" fill="none" stroke="#C83F3B" stroke-width="2"/><rect x="285" y="205" width="205" height="186" rx="2" fill="#FFFFFF" stroke="#D6D9D5" stroke-width="2"/><path d="M285 205h205" stroke="#C83F3B" stroke-width="6"/><text x="303" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#BA4944" font-weight="700">02 / STEP</text><text x="303" y="291" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1C2727" font-weight="700">Classify evidence</text><text x="303" y="332" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#485755" >Sources / timestamps</text><text x="303" y="356" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#485755" >Known / missing</text><path d="M495 290h13m-5 -6l6 6l-6 6" fill="none" stroke="#C83F3B" stroke-width="2"/><rect x="514" y="205" width="205" height="186" rx="2" fill="#E6EEE8" stroke="#A3BAA7" stroke-width="2"/><path d="M514 205h205" stroke="#2D6258" stroke-width="6"/><text x="532" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#BA4944" font-weight="700">03 / STEP</text><text x="532" y="291" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1C2727" font-weight="700">Evaluate</text><text x="532" y="332" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#485755" >6 configurable criteria</text><text x="532" y="356" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#485755" >Coverage / bounds</text><path d="M724 290h13m-5 -6l6 6l-6 6" fill="none" stroke="#C83F3B" stroke-width="2"/><rect x="743" y="205" width="205" height="186" rx="2" fill="#FFFFFF" stroke="#D6D9D5" stroke-width="2"/><path d="M743 205h205" stroke="#C83F3B" stroke-width="6"/><text x="761" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#BA4944" font-weight="700">04 / STEP</text><text x="761" y="291" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1C2727" font-weight="700">Stress test</text><text x="761" y="332" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#485755" >13 weight scenarios</text><text x="761" y="356" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#485755" >Rank stability</text><path d="M953 290h13m-5 -6l6 6l-6 6" fill="none" stroke="#C83F3B" stroke-width="2"/><rect x="972" y="205" width="205" height="186" rx="2" fill="#FFFFFF" stroke="#D6D9D5" stroke-width="2"/><path d="M972 205h205" stroke="#C83F3B" stroke-width="6"/><text x="990" y="242" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#BA4944" font-weight="700">05 / STEP</text><text x="990" y="291" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1C2727" font-weight="700">Human review</text><text x="990" y="332" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#485755" >City specialist</text><text x="990" y="356" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#485755" >Decision remains human</text><rect x="56" y="437" width="1087" height="55" fill="#1D2929"/><text x="78" y="470" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#F3A3A0" font-weight="700">GUARDRAILS</text><text x="230" y="470" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#FFFFFF" >No silent imputation  ·  Source labels  ·  Adjustable policy  ·  Human approval</text></svg>