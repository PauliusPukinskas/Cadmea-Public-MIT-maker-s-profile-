<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="Synthetic missing data example: 30 percent input coverage gives conditional score 80 but full range 24 to 94"><rect width="1200" height="550" fill="#FAFAF8"/><path d="M0 0H1200" stroke="#C83F3B" stroke-width="10"/><text x="56" y="59" fill="#C83F3B" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3">CADMEA / ENGINEERING FIELD NOTES</text><text x="56" y="118" font-family="Arial,Helvetica,sans-serif" font-size="39" fill="#182122" font-weight="700">When 70% of evidence is missing,</text><text x="56" y="166" font-family="Arial,Helvetica,sans-serif" font-size="39" fill="#182122" font-weight="700">an 80/100 headline is not enough.</text><text x="56" y="209" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#5F6E68" >Synthetic unit-test fixture  ·  demand pressure = 80  ·  weight = 30%</text><rect x="56" y="252" width="530" height="74" fill="#E9EEEA"/><text x="76" y="281" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#416257" font-weight="700">DATA COVERAGE</text><text x="76" y="315" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#20332C" font-weight="700">30% observed  |  70% unknown</text><path d="M95 392H1100" stroke="#C9D1CD" stroke-width="6"/><path d="M336.2 392H1039.6999999999998" stroke="#C83F3B" stroke-width="16" stroke-linecap="square"/><path d="M336.2 366v52" stroke="#C83F3B" stroke-width="4"/><text x="318.2" y="350" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#C83F3B" font-weight="700">24</text><path d="M899 366v52" stroke="#1B4840" stroke-width="4"/><text x="881" y="449" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#184B40" font-weight="700">80</text><path d="M1039.7 366v52" stroke="#C83F3B" stroke-width="4"/><text x="1021.7" y="350" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#C83F3B" font-weight="700">94</text><text x="56" y="512" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5F6E68" >Range 24–94 = logical bounds under missing inputs, NOT a statistical confidence interval.</text></svg>